name: Validate and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -x --tb=short
      - run: uv run ty check scripts tests
      - name: Package skills
        run: |
          mkdir -p skills
          uv run python -m scripts.skill_catalog skills --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-bundles
          path: dist/
          if-no-files-found: error

  evaluate:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Mint backend workflow token
        id: backend-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SKILLS_EVAL_APP_ID }}
          private-key: ${{ secrets.SKILLS_EVAL_APP_PRIVATE_KEY }}
          owner: Further-AI
          repositories: fai-automation-backend
          permission-actions: write
      - name: Start evaluation for this exact merge
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.backend-token.outputs.token }}
          SKILLS_COMMIT: ${{ github.sha }}
        run: |
          response=$(gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/Further-AI/fai-automation-backend/actions/workflows/skills-evaluation.yml/dispatches \
            -f ref=main -f "inputs[skills_commit]=$SKILLS_COMMIT")
          run_id=$(jq -er '.workflow_run_id | select(type == "number" and . > 0)' <<< "$response")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "[Backend evaluation](https://github.com/Further-AI/fai-automation-backend/actions/runs/$run_id)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for evaluation to pass
        env:
          GH_TOKEN: ${{ steps.backend-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo Further-AI/fai-automation-backend --interval 20 --exit-status
      - name: Cancel unfinished evaluation when this gate fails
        if: ${{ (failure() || cancelled()) && steps.dispatch.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ steps.backend-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run cancel "$RUN_ID" --repo Further-AI/fai-automation-backend

  publish:
    needs: [validate, evaluate]
    if: >-
      vars.SKILLS_PUBLISH_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: us-staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: skills-publish-us-staging
      # An older validation run must not replace the newest pending release.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Require the current main commit
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer commit is on main. Run the workflow for the current main commit."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-bundles
          path: dist
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Publish complete catalog
        env:
          SKILLS_API_URL: ${{ vars.SKILLS_API_URL }}
        run: |
          uv run python -m scripts.publish_skill dist \
            --api-url "$SKILLS_API_URL" \
            --audience furtherai-skills-us-staging
