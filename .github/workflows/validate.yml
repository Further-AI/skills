name: Validate and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -x --tb=short
      - run: uv run ty check scripts tests
      - name: Package skills
        run: |
          mkdir -p skills
          uv run python -m scripts.skill_catalog skills --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-bundles
          path: dist/
          if-no-files-found: error

  evaluate:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/evaluate.yml
    with:
      commit: ${{ github.sha }}
    secrets:
      evaluation_app_key: ${{ secrets.SKILLS_EVAL_APP_PRIVATE_KEY }}

  publish:
    needs: [validate, evaluate]
    if: >-
      vars.SKILLS_PUBLISH_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: us-staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: skills-publish-us-staging
      # An older validation run must not replace the newest pending release.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Require the current main commit
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer commit is on main. Run the workflow for the current main commit."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-bundles
          path: dist
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Publish complete catalog
        env:
          SKILLS_API_URL: ${{ vars.SKILLS_API_URL }}
        run: |
          uv run python -m scripts.publish_skill dist \
            --api-url "$SKILLS_API_URL" \
            --audience furtherai-skills-us-staging \
            --environment staging
