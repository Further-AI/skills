name: Validate and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -x --tb=short
      - run: uv run ty check scripts tests skills-backlog/excel-generation/scripts

  publish:
    needs: validate
    if: >-
      vars.SKILLS_PUBLISH_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # A failure in one environment must not cancel the other publication.
      fail-fast: false
      matrix:
        include:
          - environment: us-staging
            audience: furtherai-skills-us-staging
          - environment: us-production
            audience: furtherai-skills-production
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: skills-publish-${{ matrix.environment }}
      # An older validation run must not replace the newest pending release.
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Require the current main commit
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer commit is on main. Run the workflow for the current main commit."
            exit 1
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Package skills
        run: |
          mkdir -p skills
          uv run python -m scripts.skill_catalog skills --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-bundles-${{ matrix.environment }}
          path: dist/
          if-no-files-found: error
      - name: Publish complete catalog
        env:
          SKILLS_API_URL: ${{ vars.SKILLS_API_URL }}
          SKILLS_PUBLISH_AUDIENCE: ${{ matrix.audience }}
        run: |
          uv run python -m scripts.publish_skill dist \
            --api-url "$SKILLS_API_URL" \
            --audience "$SKILLS_PUBLISH_AUDIENCE"
