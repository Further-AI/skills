name: Update evaluation comment
on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: number
      commit:
        required: true
        type: string
      state:
        required: true
        type: string
      backend_run:
        default: ''
        type: string
    secrets:
      evaluation_app_key:
        required: true
permissions:
  contents: read
  pull-requests: write
jobs:
  comment:
    # Serialize pending and final updates, including separate workflow runs.
    concurrency:
      group: skills-evaluation-comment-${{ inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.10.4'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Mint backend read token
        if: inputs.backend_run != ''
        id: backend-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.SKILLS_EVAL_APP_ID }}
          private-key: ${{ secrets.evaluation_app_key }}
          owner: Further-AI
          repositories: fai-automation-backend
          permission-actions: read
      - name: Download aggregate scores
        if: inputs.backend_run != ''
        id: summary
        # A failed run can lack a summary; the comment must still report that failure.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.backend-token.outputs.token }}
          RUN_ID: ${{ inputs.backend_run }}
        run: gh run download "$RUN_ID" --repo Further-AI/fai-automation-backend --name skills-evaluation-summary --dir score-summary
      - name: Update PR result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          COMMIT: ${{ inputs.commit }}
          STATE: ${{ inputs.state }}
          BACKEND_RUN: ${{ inputs.backend_run }}
          COMMENT_RUN: ${{ github.run_number }}
          COMMENT_ATTEMPT: ${{ github.run_attempt }}
        run: |
          uv run python -m scripts.evaluation_comment \
            --pr "$PR" --commit "$COMMIT" --state "$STATE" \
            --backend-run "$BACKEND_RUN" --run "$COMMENT_RUN" --attempt "$COMMENT_ATTEMPT" \
            --summary score-summary/summary.json
