[project]
name = "furtherai-skills"
version = "0.1.0"
description = "FurtherAI-authored agent skills"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "pytest>=8",
    "ty",
    "openpyxl>=3.1.5,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "skills/excel-generation/scripts"]

[tool.ty.environment]
extra-paths = ["skills/excel-generation/scripts"]
